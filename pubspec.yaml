name: divinewall
description: A Vastu Shastra compass and floor plan analysis app.
publish_to: none
version: 1.0.4+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  audioplayers: ^6.5.1
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  file_picker: ^10.3.10
  flutter_compass: ^0.8.1
  google_fonts: ^6.2.1
  http: ^1.5.0
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: 10.0.2
  shared_preferences: ^2.3.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  youtube_player_iframe: ^5.2.1
  package_info_plus: ^9.0.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - backend/data/remedies-catalog.json
    - assets/images/
    - assets/images/app_logo.png
    - assets/images/vastu_p1.png
    - assets/images/kv_c.png
    - assets/images/45_d.png
    - assets/images/main_chakraa.png
    - assets/images/kuber_vastu_logo.jpeg
    - assets/images/kuber_vastu_logo.png
    - assets/images/khubar_vastu_ceo.jpeg
    - assets/images/vijay_kumar_goyal.jpg
    - assets/audio/
